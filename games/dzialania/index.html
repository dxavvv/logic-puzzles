<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d1a">
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="icon" type="image/png" href="../../assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <title>Działania – Łamigłówki logiczne</title>
    <link rel="stylesheet" href="../../assets/base.css">
    <link rel="stylesheet" href="../../assets/mobile.css">
</head>
<body>
    <div class="game-container">
        <a href="../../index.html" class="back-link">← Powrót do menu</a>
        <h1>➕ Działania</h1>

        <div class="rules-box">
            <strong>Zasady:</strong>
            <ul>
                <li>Wpisz cyfry od <strong>1</strong> do <strong>n</strong> tak, aby nie powtarzały się w wierszach i kolumnach.</li>
                <li>Każdy pogrubiony obszar zawiera cyfry dające podany wynik działania (+, −, ×, :). Kolejność cyfr w obszarze nie ma znaczenia.</li>
            </ul>
        </div>

        <div class="controls-row">
            <label>Rozmiar:
                <select id="selectSize">
                    <option value="4">4×4</option>
                    <option value="5" selected>5×5</option>
                    <option value="6">6×6</option>
                </select>
            </label>
            <label>Poziom:
                <select id="selectDifficulty">
                    <option value="easy">Łatwy</option>
                    <option value="medium" selected>Średni</option>
                    <option value="hard">Trudny</option>
                </select>
            </label>
        </div>
        <div class="controls-row">
            <button class="primary" id="btnNew">🎲 Nowa gra</button>
            <button id="btnCheck">✅ Sprawdź</button>
            <button class="accent" id="btnSolve">🤖 Rozwiąż</button>
            <button class="danger" id="btnReset">🔄 Resetuj</button>
        </div>

        <div class="grid-wrapper">
            <div class="board-grid plain" id="boardGrid"></div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="status-area neutral" id="statusArea"></div>
        <div class="stats-row" id="statsRow"></div>
    </div>

    <script src="../../assets/i18n.js"></script>
    <script src="../../assets/pixel.js"></script>
    <script src="../../assets/fx.js"></script>
    <script src="../../assets/mobile.js"></script>
    <script src="../../assets/common.js"></script>
    <script src="script.js"></script>
</body>
</html>
