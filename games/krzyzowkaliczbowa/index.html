<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krzyżówka liczbowa – Łamigłówki logiczne</title>
    <link rel="stylesheet" href="../../assets/base.css">
</head>
<body>
    <div class="game-container">
        <a href="../../index.html" class="back-link">← Powrót do menu</a>
        <h1>📰 Krzyżówka liczbowa</h1>

        <div class="rules-box">
            <strong>Zasady:</strong>
            <ul>
                <li>Wpisz w białe pola cyfry od <strong>1</strong> do <strong>9</strong> tak, aby zgadzały się sumy poziome i pionowe.</li>
                <li>Liczba nad ukośną kreską to suma w prawo, pod kreską – suma w dół. W obrębie jednej sumy cyfry <strong>nie mogą się powtarzać</strong> (16 = 7+9 się nadaje, 8+8 – nie).</li>
            </ul>
        </div>

        <div class="controls-row">
            <label>Rozmiar:
                <select id="selectSize">
                    <option value="6">6×6</option>
                    <option value="8" selected>8×8</option>
                    <option value="10">10×10</option>
                </select>
            </label>
            <label>Poziom:
                <select id="selectDifficulty">
                    <option value="easy">Łatwy</option>
                    <option value="medium" selected>Średni</option>
                    <option value="hard">Trudny</option>
                </select>
            </label>
        </div>
        <div class="controls-row">
            <button class="primary" id="btnNew">🎲 Nowa gra</button>
            <button id="btnCheck">✅ Sprawdź</button>
            <button class="accent" id="btnSolve">🤖 Rozwiąż</button>
            <button class="danger" id="btnReset">🔄 Resetuj</button>
        </div>

        <div class="grid-wrapper">
            <div class="board-grid plain" id="boardGrid"></div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="status-area neutral" id="statusArea"></div>
        <div class="stats-row" id="statsRow"></div>
    </div>

    <script src="../../assets/i18n.js"></script>
    <script src="../../assets/pixel.js"></script>
    <script src="../../assets/fx.js"></script>
    <script src="../../assets/common.js"></script>
    <script src="script.js"></script>
</body>
</html>
